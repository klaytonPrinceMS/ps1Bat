[tool.poetry]
name = "sos-manutencao-harness"
version = "2.1.261021"
description = "Harness Python (testes estaticos e execucao) da ferramenta T! SOS Sistemas"
authors = ["T! SOS Sistemas"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
mkdocs = ">=1.6"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2"]
build-backend = "poetry.core.masonry.api"
